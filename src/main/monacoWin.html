<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Vencord QuickCSS Editor</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/editor/editor.main.css"
            integrity="sha256-tiJPQ2O04z/pZ/AwdyIghrOMzewf+PIvEl1YKbQvsZk="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <style>
            html,
            body,
            #container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>

    <body>
        <div id="container"></div>
        <script
            src="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/loader.js"
            integrity="sha256-KcU48TGr84r7unF7J5IgBo95aeVrEbrGe04S7TcFUjs="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>

        <script>
            const editorParams = new URLSearchParams(location.hash.slice(1));
            const editorLocale = editorParams.get("locale") === "zh-CN" ? "zh-CN" : "en-US";
            document.documentElement.lang = editorLocale;
            document.title = editorParams.get("title") || document.title;
            let editor;

            window.setEditorLocale = async (fragment) => {
                const nextParams = new URLSearchParams(fragment);
                if (nextParams.get("locale") === editorLocale) return;
                // Save directly before reloading the NLS bundle, including pending edits.
                if (editor) {
                    await VencordNative.quickCss.set(editor.getValue());
                    nextParams.set("viewState", JSON.stringify(editor.saveViewState()));
                }
                location.hash = nextParams.toString();
                location.reload();
            };

            require.config({
                paths: {
                    vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs",
                },
                "vs/nls": {
                    availableLanguages: editorLocale === "zh-CN" ? { "*": "zh-cn" } : {},
                },
            });

            require(["vs/editor/editor.main"], () => {
                getCurrentCss().then((css) => {
                    editor = monaco.editor.create(
                        document.getElementById("container"),
                        {
                            value: css,
                            language: "css",
                            theme: getTheme(),
                            ariaLabel: editorParams.get("editorLabel") || document.title,
                        }
                    );
                    const previousView = editorParams.get("viewState");
                    if (previousView) {
                        try { editor.restoreViewState(JSON.parse(previousView)); } catch {}
                    }
                    editor.onDidChangeModelContent(() =>
                        setCss(editor.getValue())
                    );
                    window.addEventListener("resize", () => {
                        // make monaco re-layout
                        editor.layout();
                    });
                });
            });
        </script>
    </body>
</html>
