<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Vencord QuickCSS Editor</title>
        <style>
            html,
            body,
            #container {
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #1e1e1e;
            }

            body {
                display: flex;
                flex-direction: column;
            }

            #title-bar {
                display: none;
            }

            @media all and (display-mode: window-controls-overlay) {
                #title-bar {
                    display: flex;
                    align-items: center;
                    padding-left: 14px;
                    font-family: Consolas, Courier New, monospace;
                    line-height: 1;
                    height: env(titlebar-area-height, 0px);
                    app-region: drag;
                    color: white;
                }
            }
        </style>
    </head>

    <body>
        <div id="title-bar">Vencord QuickCSS Editor</div>
        <div id="container"></div>

        <script>
            (() => {
            document.documentElement.lang = quickCssLocale;
            document.title = quickCssTitle;
            document.getElementById("title-bar").textContent = quickCssTitle;
            const script = document.createElement("script");
            script.src = new URL("/vendor/monaco/index.js", baseUrl);

            const style = document.createElement("link");
            style.type = "text/css";
            style.rel = "stylesheet";
            style.href = new URL("/vendor/monaco/index.css", baseUrl);

            document.body.append(style);
            if (quickCssLocale === "zh-CN") {
                const messages = document.createElement("script");
                messages.src = new URL("/vendor/monaco/nls.zh-cn.js", baseUrl);
                messages.onload = () => document.body.append(script);
                document.body.append(messages);
            } else {
                globalThis._VSCODE_NLS_MESSAGES = undefined;
                globalThis._VSCODE_NLS_LANGUAGE = undefined;
                document.body.append(script);
            }
            })();
        </script>
    </body>
</html>
